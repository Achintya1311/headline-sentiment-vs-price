name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        # FinBERT/torch tests are deselected, not run and ignored: torch is
        # deliberately not in requirements.txt (see its own comment there -
        # the CPU wheel needs a separate install step this zero-spend
        # portfolio's CI does not take on), so these fail on every runner
        # that only has requirements.txt installed, the same documented gap
        # README Limitations already names for the sandbox this was built
        # in. Every non-FinBERT test runs and must pass.
        run: >
          pytest -q
          --ignore=tests/test_finbert_score.py
          --ignore=tests/test_finbert_cli.py
          --ignore=tests/test_agreement.py

      - name: Leakage audit - shuffled headline timestamps must not fake a signal
        # Day 8's control: reshuffle which headline got which published_at
        # (same titles, same compound scores, same resolved tickers) 500
        # times and confirm the real correlation isn't an outlier against
        # that null, and that shuffling itself doesn't manufacture
        # "significant" results far more often than a correctly calibrated
        # 95% CI would by chance. See sentiment/audit.py and README Day 8.
        run: python -m sentiment.audit
