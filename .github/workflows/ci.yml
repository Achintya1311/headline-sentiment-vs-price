name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # CPU-only wheel, free, no CUDA - see requirements.txt's own note.
          # Installed here (GitHub Actions has real network access) so the
          # FinBERT tests run for real in CI, unlike in a sandbox with no
          # network where they are a documented, pre-existing skip.
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run the test suite
        run: pytest

      - name: Shuffled-timestamp leakage audit (the correctness gate)
        run: python -m sentiment.audit
