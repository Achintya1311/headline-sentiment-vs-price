name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          # CPU-only wheel (see requirements.txt's own comment on why it's
          # not pinned there) - free, no API key, needed for the FinBERT
          # tests and CLI this sandbox couldn't install torch for.
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Tests
        run: pytest -q

      - name: Leakage audit - shuffle headline timestamps, confirm the signal disappears
        # The correctness gate the README's "Done when" section names: fails
        # the build, the same way a broken test would, if a shuffled-timestamp
        # control predicts returns as well as the real, leak-free alignment.
        run: python -m sentiment.audit
