name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          # CPU-only torch wheel (free) so the FinBERT tests run in CI instead of being skipped.
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Tests
        # Plain scripts layout (no pyproject), so the repo root must be on
        # sys.path: `python -m pytest`, not bare `pytest` (which cannot import
        # `sentiment` here - verified, 18 collection errors).
        run: python -m pytest -q

      - name: Leakage audit - shuffle headline timestamps, the signal must disappear
        # The "Done when" gate from NEXT_STEPS.md, run directly and not just
        # as one assertion inside the suite: if a shuffled-timestamp control
        # reproduces the real correlation, the pipeline is leaking and the
        # build should fail loudly, not just log a warning.
        run: python -m sentiment.audit

      - name: Leakage audit - lagged correlation and Day 6 regression
        run: python -m sentiment.leakage_audit

      - name: Robustness checks - move-naming headlines, market-wide shocks, feed timestamps
        run: python -m sentiment.robustness
