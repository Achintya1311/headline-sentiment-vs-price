name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # CPU-only wheel, free - see requirements.txt's own comment on why
          # it isn't pinned there directly.
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run test suite
        run: python -m pytest -q

      - name: Run the leakage/audit gate (NEXT_STEPS.md "Done when")
        run: python -m sentiment.audit
