name: Refresh price fixtures

# D26 (hub CRITIQUES.md): fixtures/prices/*.json have been frozen at their
# Day-5 fetch window (2026-08-31 to 2026-09-29) ever since, with no workflow
# anywhere that refreshes them - unlike the headline side, which
# collect-headlines.yml genuinely grows daily. That silently pins every
# statistical finding in this repo (sentiment.correlate/regress/overlay/
# audit/leakage_audit) at the Day-5 sample forever, no matter how long the
# headline corpus keeps growing. This runs the already-tested
# sentiment.fetch_prices CLI (sentiment.prices.load_bars's existing --live
# path, merged rather than overwritten so coverage only grows) without
# anyone starting it by hand - the same pattern collect-headlines.yml,
# reverse-dcf-engine's fetch-market-price.yml and
# markowitz-portfolio-optimizer's fetch-largecaps.yml already use elsewhere
# in this portfolio.
#
# Triggers once on push of this file or the script itself, so committing
# either one starts the first real fetch with no manual dispatch. Weekly
# after that is enough: Yahoo's chart endpoint returns about a month of
# bars per call, so a run every 7 days keeps every known ticker's coverage
# contiguous with no gap.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-prices.yml"
      - "sentiment/fetch_prices.py"
      - "sentiment/prices.py"
      - "sentiment/tickers.py"
  schedule:
    - cron: "30 16 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The README install (P86), so the test step below can run the suite.
        # No torch: the FinBERT tests skip without it (P87), and ci.yml runs them.
        run: pip install -r requirements.txt -e .

      - name: Refresh every known ticker's price fixture (best effort)
        # A transient Yahoo fetch error for one ticker is not a workflow
        # failure - sentiment.fetch_prices already reports it and continues
        # to the rest. The commit step below is the real pass/fail signal.
        run: python -m sentiment.fetch_prices
        continue-on-error: true

      - name: Test before committing
        # P88 (hub CRITIQUES.md): the GITHUB_TOKEN push below triggers no
        # ci.yml run, so a data change that broke a test would otherwise sit
        # on main unseen. The FinBERT tests skip here (no torch).
        run: pytest -q

      - name: Commit if any fixture changed
        run: |
          git config user.name "Achintya1311"
          git config user.email "67464985+Achintya1311@users.noreply.github.com"
          git add fixtures/prices
          if git diff --cached --quiet; then
            echo "no price changes since the last refresh - nothing to commit"
            exit 0
          fi
          git commit -m "data: refresh price fixtures ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (likely a concurrent commit from collect-headlines.yml or finbert-sentiment-contract.yml) - rebasing and retrying"
            git fetch origin main
            git rebase origin/main
          done
          echo "push still failing after 3 attempts" >&2
          exit 1
