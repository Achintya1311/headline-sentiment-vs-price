[project]
name = "sentiment"
version = "0.0.1"
description = "Headline sentiment vs price: does Economic Times market-headline sentiment lead or lag price moves?"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "requests",
    "beautifulsoup4",
    "lxml",
    "nltk",
    "matplotlib",
    "transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentiment*"]
